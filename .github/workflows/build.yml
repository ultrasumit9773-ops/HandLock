
name: Build HandLock APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip -o HandLock-source.zip

      - name: Build APK
        run: gradle --no-daemon -p HandLock assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HandLock-debug-apk
          path: HandLock/app/build/outputs/apk/debug/app-debug.apk
